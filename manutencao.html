    --teal-dark: #014c43;
    --teal-darker: #013a33;

  *,*::before,*::after{ box-sizing: border-box; }

  }
  .card{
    max-width: 460px;
    width: 100%;
    text-align: center;
  }
  .card img{
    height: 56px;
    width: auto;
    margin: 0 auto 32px;
  }
  .eyebrow{
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--yellow);
    margin-bottom: 14px;
  }
  h1{
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    font-weight: 700;
    line-height: 1.25;
    margin: 0 0 16px;
  }
  p{
    font-size: 1rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
    margin: 0 0 32px;
  }
  .btn-whatsapp{

    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    background: #25D366;
    color: var(--white);
    text-decoration: none;
    transition: transform 0.2s ease;
  }
  .btn-whatsapp:hover{ transform: translateY(-2px); }
  .btn-whatsapp svg{ width: 20px; height: 20px; fill: currentColor; }
  .contacts{
    margin-top: 36px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.9rem;
    color: rgba(255,255,255,0.75);
  }
  .contacts a{ color: var(--white); text-decoration: none; }
  .contacts a:hover{ text-decoration: underline; }
  .socials{
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .socials a{
    width: 38px; height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex; align-items: center; justify-content: center;
    color: var(--white);
    transition: background 0.2s ease;
  }
  .socials a:hover{ background: rgba(255,255,255,0.2); }
  .socials svg{ width: 18px; height: 18px; fill: currentColor; }
